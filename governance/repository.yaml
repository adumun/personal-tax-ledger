schema_version: 1
repository:
  name: personal-tax-ledger
  owner: cmartinezs
  canonical_url: https://github.com/cmartinezs/personal-tax-ledger
  type: PRODUCT
  secondary_types:
    - REFERENCE_IMPLEMENTATION
  facets:
    - END_USER_FIRST
    - DESKTOP_APPLICATION
    - UAT_ACTIVE
    - LOCAL_FIRST
    - TAX_DOMAIN
  purpose: >-
    Help people in Chile organize personal tax information, simulate annual tax
    scenarios and understand the effect of salaries, fees, APV and mortgage-related
    items through an explainable local desktop application.
  status:
    lifecycle: UAT
    maturity: EXTERNAL_USER_VALIDATION_0_1_6
  scope:
    includes:
      - annual personal tax simulation support for Chile
      - salaries and multiple employers
      - fee receipts and related treatment
      - APV scenarios
      - mortgage-related treatment currently modeled
      - explainable annual result and supporting references
      - local desktop persistence
      - public UAT participation and feedback
    excludes:
      - replacing the Servicio de Impuestos Internos
      - filing official tax returns
      - professional tax advice
      - claiming complete coverage of every Chilean tax case
  non_claims:
    - PTL 0.1.6 is a functional UAT build, not a final production release.
    - A PTL estimate is not official SII truth.
    - Public UAT evidence does not certify complete tax correctness.
  capabilities:
    - ANNUAL_TAX_SIMULATION
    - SALARY_AND_MULTIPLE_EMPLOYER_MODELING
    - FEE_RECEIPT_MODELING
    - APV_SCENARIO_COMPARISON
    - MORTGAGE_TAX_MODELING
    - EXPLAINABLE_RESULTS
    - LOCAL_DATA_PERSISTENCE
    - EXTERNAL_UAT_FEEDBACK
  canonical_branch: master

audiences:
  primary:
    - USER
  secondary:
    - DEVELOPER
    - GOVERNANCE

