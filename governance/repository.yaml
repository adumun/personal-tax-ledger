    source: README.md
    type: [CONCEPT, FACT]
    intent: [DESCRIPTIVE, SUMMARY]
    audiences: [USER, DEVELOPER, GOVERNANCE]
    authority: CANONICAL_INFORMATIVE
    confidentiality: PUBLIC
    publication: REQUIRED
  - id: product-home
    source: site/index.html
    type: [CONCEPT, FACT]
    intent: [DESCRIPTIVE, SUMMARY]
    audiences: [USER]
    authority: DERIVED_READ_MODEL
    confidentiality: PUBLIC
    publication: REQUIRED
  - id: user-capabilities
    source: site/usage.html
    type: [CONCEPT, PROCEDURE]
    intent: [DESCRIPTIVE, PROCEDURAL]
    audiences: [USER]
    authority: DERIVED_READ_MODEL
    confidentiality: PUBLIC
    publication: REQUIRED
  - id: uat-participation
    source: site/uat.html
    type: [PROCEDURE, STATE]
    intent: [PROCEDURAL, DESCRIPTIVE]
    audiences: [USER]
    authority: DERIVED_READ_MODEL
    confidentiality: PUBLIC
    publication: REQUIRED
  - id: user-faq
    source: site/faq.html
    type: [REFERENCE]
    intent: [REFERENCE]
    audiences: [USER]
    authority: DERIVED_READ_MODEL
    confidentiality: PUBLIC
    publication: REQUIRED
  - id: contributor-entrypoint
    source: site/contribute.html
    type: [PROCEDURE, REFERENCE]
    intent: [PROCEDURAL, REFERENCE]
    audiences: [DEVELOPER, GOVERNANCE]
    authority: DERIVED_READ_MODEL
    confidentiality: PUBLIC
    publication: REQUIRED
  - id: architecture-current-state
    source: docs/architecture/current-state.md
