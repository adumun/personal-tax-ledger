publication:
  enabled: true
  derived_read_model: true
  visibility: PUBLIC
  target: GH_PAGES
  branch: gh-pages
  mode: BUILD_FROM_BRANCH
  folder: /
  github_actions_deployment:
    allowed: EXCEPTION_ONLY
    exception: null
  freshness:
    same_change_expected: true
  completeness_mode: ACTIVE_DECLARED_GAPS_ALLOWED

conformance:
  target: FULL
  current: PRODUCT_UAT_ADOPTION
  declared_gaps:
    - id: PTL-SITE-001
      concern: PUBLIC_UAT_BINARY_NOT_YET_PUBLISHED_AS_GITHUB_RELEASE
      affected_audiences: [USER]
      rationale: The validated UAT 0.1.6 installer exists, but no public GitHub Release asset is currently published in the repository.
      status: ACTIVE
      remediation: Publish the validated UAT 0.1.6 installer as a public GitHub Release asset and replace the generic Releases entrypoint with the exact public artifact URL.
      owner: PTL
    - id: PTL-SITE-002
      concern: BUILDER_PRODUCT_PROFILE_ADOPTION_NOT_YET_EXECUTED
      affected_audiences: [USER, DEVELOPER, GOVERNANCE]
      rationale: PTL now declares PRODUCT and USER-first governance, but standard-repo-website-builder adoption has not yet regenerated this site from the governed contract.
      status: ACTIVE
      remediation: Run PTL through the repository website builder once Wave 7 multi-repository adoption is unblocked.
      owner: PTL
