    intent: [EXPLANATORY, REFERENCE]
    audiences: [DEVELOPER, GOVERNANCE]
    authority: CANONICAL_INFORMATIVE
    confidentiality: PUBLIC
    publication: REQUIRED
  - id: desktop-uat-evidence
    source: docs/desktop/uat-evidence-0.1.6-presentation-2026-09-07.md
    type: [EVIDENCE, STATE, HISTORY]
    intent: [REFERENCE, DESCRIPTIVE]
    audiences: [DEVELOPER, GOVERNANCE]
    authority: IMPLEMENTATION_EVIDENCE
